<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>8 Figure Firm — Call Audit Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
    }
    .logo-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }
    .logo-row img { height: 36px; object-fit: contain; }
    .logo-text {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: #888;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .card {
      background: #141414;
      border: 0.5px solid #2a2a2a;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 460px;
    }
    .divider { width: 40px; height: 2px; background: #c0392b; margin: 0 auto 1.25rem; }
    .card-title { font-size: 18px; font-weight: 500; color: #fff; margin-bottom: 4px; text-align: center; }
    .card-sub { font-size: 13px; color: #666; margin-bottom: 1.5rem; text-align: center; }
    .card-header { border-bottom: 0.5px solid #222; padding-bottom: 1.25rem; margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
      margin-top: 1rem;
    }
    input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 10px 14px;
      background: #0a0a0a;
      border: 0.5px solid #2a2a2a;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      text-align: center;
    }
    input[type="text"]:focus, input[type="date"]:focus { border-color: #c0392b; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.4); }
    .file-zone {
      width: 100%;
      margin-top: 1rem;
      border: 0.5px dashed #333;
      border-radius: 8px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border 0.2s;
      background: #0a0a0a;
    }
    .file-zone:hover { border-color: #c0392b; }
    .file-zone i { font-size: 28px; color: #444; display: block; margin-bottom: 8px; }
    .file-zone-text { font-size: 13px; color: #555; }
    .file-zone-text span { color: #c0392b; }
    .file-list { margin-top: 10px; text-align: left; }
    .file-list-item { font-size: 12px; color: #888; padding: 4px 0; border-bottom: 0.5px solid #1e1e1e; }
    .file-list-item:last-child { border-bottom: none; }
    #file-input { display: none; }
    .btn {
      width: 100%;
      margin-top: 1.5rem;
      padding: 13px;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #a93226; }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    .progress-wrap { margin-top: 1.25rem; display: none; }
    .progress-track { width: 100%; height: 3px; background: #222; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: #c0392b; width: 0%; transition: width 0.3s; }
    .status { font-size: 12px; color: #666; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <div class="logo-row">
    <img src="https://www.8figurefirm.com/wp-content/uploads/2021/09/logo-white.png" alt="8 Figure Firm">
    <div class="logo-text">Call Audit Portal</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="divider"></div>
      <div class="card-title">Upload Call Recordings</div>
      <div class="card-sub">Secure upload — files go directly to your firm's folder.</div>
    </div>

<label>Month of calls</label>
<select id="date">
  <option value="">Select month...</option>
  <option value="January 2026">January 2026</option>
  <option value="February 2026">February 2026</option>
  <option value="March 2026">March 2026</option>
  <option value="April 2026">April 2026</option>
  <option value="May 2026">May 2026</option>
  <option value="June 2026">June 2026</option>
  <option value="July 2026">July 2026</option>
  <option value="August 2026">August 2026</option>
  <option value="September 2026">September 2026</option>
  <option value="October 2026">October 2026</option>
  <option value="November 2026">November 2026</option>
  <option value="December 2026">December 2026</option>
</select>

    <label>Recording files</label>
    <div class="file-zone" onclick="document.getElementById('file-input').click()">
      <i class="ti ti-upload"></i>
      <div class="file-zone-text">Drop files here or <span>browse</span></div>
      <div class="file-list" id="file-list"></div>
    </div>
    <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.mp4,.wav,.m4a,.ogg" multiple>

    <button class="btn" id="submit-btn" onclick="uploadFile()">Submit recordings</button>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="status" id="status">Uploading...</div>
    </div>
  </div>

  <script>
    document.getElementById('file-input').addEventListener('change', function () {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      for (const f of this.files) {
        const div = document.createElement('div');
        div.className = 'file-list-item';
        div.textContent = f.name;
        list.appendChild(div);
      }
    });

    async function uploadFile() {
      const date = document.getElementById('date').value.trim();
      const files = document.getElementById('file-input').files;
      const btn = document.getElementById('submit-btn');

      if (!date || files.length === 0) {
        alert('Please fill in all fields and select at least one file.');
        return;
      }

      const fd = new FormData();
      fd.append('date', date);
      for (let i = 0; i < files.length; i++) {
        fd.append('recordings', files[i]);
      }

      btn.disabled = true;
      document.getElementById('progress-wrap').style.display = 'block';
      document.getElementById('status').textContent = 'Uploading...';

      const xhr = new XMLHttpRequest();
      xhr.open('POST', window.location.pathname);

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const p = Math.round(e.loaded / e.total * 100);
          document.getElementById('progress-fill').style.width = p + '%';
          document.getElementById('status').textContent = 'Uploading... ' + p + '%';
        }
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          document.getElementById('status').textContent = 'Upload complete. Thank you.';
          document.getElementById('progress-fill').style.width = '100%';
        } else {
          document.getElementById('status').textContent = 'Upload failed. Please try again.';
          btn.disabled = false;
        }
      };

      xhr.onerror = () => {
        document.getElementById('status').textContent = 'Connection error. Please try again.';
        btn.disabled = false;
      };

      xhr.send(fd);
    }
  </script>
</body>
</html>
